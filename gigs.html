  <!-- ===== OLD GIGS API (SunsetDJs on Railway — project closed, kept for reference) =====
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const apiURL = 'https://sunsetdjsnew-production.up.railway.app/api/gigs/?dj=javi';

      const containers = {
        'DRIFT': {
          list: document.getElementById('gigs-drift'),
          card: document.getElementById('card-drift')
        },
        'AURA': {
          list: document.getElementById('gigs-aura'),
          card: document.getElementById('card-aura')
        },
        'AZURE': {
          list: document.getElementById('gigs-azure'),
          card: document.getElementById('card-azure')
        }
      };

      function formatDate(dateString) {
        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', options);
      }

      console.log("Gigs system initialized. Fetching:", apiURL);

      fetch(apiURL)
        .then(response => {
          if (!response.ok) throw new Error("API Connection Error: " + response.status);
          return response.json();
        })
        .then(data => {
          console.log("Live Gigs Response:", data);
          const gigs = data.gigs || [];
          console.log("Server thinks today is:", data.server_date);

          if (gigs && gigs.length > 0) {
            gigs.forEach(gig => {
              const venueName = (gig.venue || "").toUpperCase().trim();

              let target = null;
              for (const key in containers) {
                if (venueName.includes(key)) {
                  target = containers[key];
                  break;
                }
              }

              if (target && target.list) {
                const gigElement = document.createElement('div');
                gigElement.style.cssText = 'margin-top: 12px; border-left: 2px solid var(--accent); padding-left: 15px; background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 2px;';

                const eventBadge = gig.is_event ? `<span style="background: var(--accent); color: var(--bg-pure); padding: 2px 6px; font-size: 9px; font-weight: 800; text-transform: uppercase; display: inline-block; margin-bottom: 5px;">SPECIAL EVENT</span> ` : '';
                const commentText = gig.comment ? `<span style="color: var(--accent); font-size: 11px; display: block; font-style: italic; margin-top: 4px;">${gig.comment}</span>` : '';

                gigElement.innerHTML = `
                  <div style="display: flex; justify-content: space-between; align-items: baseline;">
                    <span style="font-weight: 700; font-size: 13px; color: var(--text-primary);">${formatDate(gig.date)}</span>
                    <span style="font-size: 11px; color: var(--text-muted);">${gig.time || ''}</span>
                  </div>
                  ${eventBadge}
                  ${commentText}
                `;
                target.list.appendChild(gigElement);
                console.log("Matched & Added gig for:", venueName);
              }
            });
          }
        })
        .catch(error => {
          console.error("Gigs Fetch Error:", error);
        });
    });
  </script>
  ===== END OLD GIGS API ===== -->

  <!-- Gigs are defined right here in the GIGS array. Past dates are hidden
       automatically. To add a gig: add a line with venue, date (YYYY-MM-DD),
       time, and optionally comment / isEvent for special events. -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Nikki Beach Sep 4-15 2026, except Sep 9 & 10 (days off)
      const NIKKI_DATES = [
        '2026-09-04', '2026-09-05', '2026-09-06', '2026-09-07', '2026-09-08',
        '2026-09-11', '2026-09-12', '2026-09-13', '2026-09-14', '2026-09-15',
      ];

      const GIGS = NIKKI_DATES.map(function (d) {
        return { venue: 'Nikki Beach Mallorca', date: d, time: '12:00 PM \u2013 6:30 PM', comment: '', isEvent: false };
      }).concat([
        // One-off gigs go here, e.g.:
        // { venue: 'Cielo Portals', date: '2026-07-18', time: '6:00 PM \u2013 8:00 PM', comment: '', isEvent: false },
        // { venue: 'Nikki Beach Mallorca', date: '2026-08-15', time: '12:00 PM \u2013 6:30 PM', comment: 'White Party', isEvent: true },
      ]);

      const containers = {
        'NIKKI': document.getElementById('gigs-nikki'),
        'LOLA': document.getElementById('gigs-lola')
      };

      function formatDate(dateString) {
        const date = new Date(dateString + 'T12:00:00');
        return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      }

      function todayISO() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      const today = todayISO();
      const gigs = GIGS
        .filter(g => g.venue && g.date >= today)
        .sort((a, b) => a.date.localeCompare(b.date));

      gigs.forEach(gig => {
        const venueName = gig.venue.toUpperCase();
        let list = null;
        for (const key in containers) {
          if (venueName.includes(key)) { list = containers[key]; break; }
        }
        if (!list) return;

        const el = document.createElement('div');
        el.style.cssText = 'margin-top: 12px; border-left: 2px solid var(--accent); background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 2px;';

        const badge = gig.isEvent ? '<span style="background: var(--accent); color: var(--bg-pure); padding: 2px 6px; font-size: 9px; font-weight: 800; text-transform: uppercase; display: inline-block; margin-top: 5px;">' + (gig.comment || 'Special Event') + '</span>' : '';
        const comment = (!gig.isEvent && gig.comment) ? '<span style="color: var(--accent); font-size: 11px; display: block; font-style: italic; margin-top: 4px;">' + gig.comment + '</span>' : '';

        el.innerHTML =
          '<div style="display: flex; justify-content: space-between; align-items: baseline;">' +
          '<span style="font-weight: 700; font-size: 13px; color: var(--text-primary);">' + formatDate(gig.date) + '</span>' +
          '<span style="font-size: 11px; color: var(--text-muted);">' + gig.time + '</span>' +
          '</div>' + badge + comment;
        list.appendChild(el);
      });

      for (const key in containers) {
        if (containers[key] && !containers[key].children.length) {
          containers[key].innerHTML = '<p style="color: var(--text-muted); font-size: 12px; margin-top: 12px;">No upcoming dates \u2014 stay tuned.</p>';
        }
      }
    });
  </script>
